[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-coordination"
version = "1.0.0"
description = "Classical AI-based traffic signal coordination for an arterial corridor: uncoordinated and greedy baselines versus a CSP optimizer with forward checking and branch-and-bound."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Rudra Patel" },
    { name = "Pruthvi Navadiya" },
]
keywords = ["traffic signals", "constraint satisfaction", "search", "AI", "simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "plotly>=5.18",
    "matplotlib>=3.7",
    "streamlit>=1.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "python-docx>=1.1",
    "python-pptx>=0.6.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B"]
ignore = [
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
    "D105",  # dunder/dataclass helpers -- the class docstring documents them
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"app.py" = ["D"]
"tools/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
"traffic_coordination.experiments" = ["configurations/*.json"]
