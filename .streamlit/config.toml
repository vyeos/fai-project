# Dashboard theme. Colours mirror the tokens in
# src/traffic_coordination/visualization/__init__.py and ui_theme.py.

[theme]
base = "light"
primaryColor = "#2457d6"
backgroundColor = "#f6f6f2"
secondaryBackgroundColor = "#efefea"
textColor = "#17191c"
linkColor = "#2457d6"
borderColor = "#e2e2dc"
showWidgetBorder = true
baseRadius = "8px"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
codeBackgroundColor = "#efefea"
dataframeHeaderBackgroundColor = "#efefea"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
